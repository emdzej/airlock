name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release (e.g. 0.4.0)'
        required: true

permissions:
  contents: read

# One place to resolve the tag. It only ever reaches shell scripts via
# $TAG (environment), never via ${{ }} interpolation into `run:`.
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Checkout ref: the tag itself, also for workflow_dispatch (which would
  # otherwise build whatever branch the dispatch was started from).
  CHECKOUT_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release, upload assets
      id-token: write        # OIDC token for build provenance
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to release: '$TAG' is not a semver-style tag" >&2
            exit 1
          fi
          echo "Releasing ${TAG}"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build linux/arm64 binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${TAG}" \
            -o dist/airlockd \
            ./cmd/airlockd
          file dist/airlockd

      - name: Package binary tarball
        working-directory: dist
        run: |
          tar czf "airlockd-${TAG}-linux-arm64.tar.gz" airlockd
          sha256sum "airlockd-${TAG}-linux-arm64.tar.gz" > "airlockd-${TAG}-linux-arm64.tar.gz.sha256"

      # install.sh installs every config file from this bundle (it
      # downloads it when piped from curl), so this layout is a contract
      # with scripts/install.sh — keep the two in sync.
      - name: Package offline install bundle
        run: |
          B="bundle/airlock-${TAG}"
          mkdir -p "$B/etc/systemd/system" \
                   "$B/etc/samba/smb.conf.d" \
                   "$B/etc/avahi/services" \
                   "$B/etc/udev/rules.d"

          cp scripts/install.sh "$B/install.sh"
          chmod +x "$B/install.sh"
          cp scripts/modprobe-airlock.conf "$B/modprobe-airlock.conf"

          # Config files, sourced from the pi-gen stage so image + installer
          # stay in lock-step.
          cp image/pi-gen/stage-airlock/01-airlockd/files/etc/systemd/system/airlockd.service \
             "$B/etc/systemd/system/airlockd.service"
          cp image/pi-gen/stage-airlock/02-samba/files/etc/samba/smb.conf \
             "$B/etc/samba/smb.conf"
          touch "$B/etc/samba/smb.conf.d/airlock.conf"
          cp image/pi-gen/stage-airlock/03-avahi/files/etc/avahi/services/airlock.service \
             "$B/etc/avahi/services/airlock.service"
          cp image/pi-gen/stage-airlock/04-udev/files/etc/udev/rules.d/99-airlock.rules \
             "$B/etc/udev/rules.d/99-airlock.rules"
          cp dist/airlockd "$B/airlockd"

          (cd bundle && tar czf "../dist/airlock-${TAG}-bundle.tar.gz" "airlock-${TAG}")

          # Checksums are written from inside dist/ so the .sha256 files
          # carry bare filenames (`sha256sum -c` works next to the download).
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum "airlock-${TAG}-bundle.tar.gz" > "airlock-${TAG}-bundle.tar.gz.sha256"
          sha256sum install.sh > install.sh.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/airlockd-${{ env.TAG }}-linux-arm64.tar.gz
            dist/airlock-${{ env.TAG }}-bundle.tar.gz
            dist/install.sh

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: airlock ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/airlockd-${{ env.TAG }}-linux-arm64.tar.gz
            dist/airlockd-${{ env.TAG }}-linux-arm64.tar.gz.sha256
            dist/airlock-${{ env.TAG }}-bundle.tar.gz
            dist/airlock-${{ env.TAG }}-bundle.tar.gz.sha256
            dist/install.sh
            dist/install.sh.sha256

  image:
    name: Build flashable pi-gen image
    # The release job creates the release; attaching here afterwards
    # avoids three jobs racing to create it.
    needs: release
    # Native arm64 runner: pi-gen's arm64 branch only fully supports a
    # native build environment, and under qemu emulation its arch-test
    # check fails inside the build container.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # Before setup-go: this wipes /opt/hostedtoolcache, where setup-go
      # installs the toolchain that build.sh needs.
      - name: Free disk space
        run: |
          # pi-gen needs ~15 GB free; GHA ubuntu runners ship with
          # ~14 GB. Nuke default toolchains we don't need.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache \
                      /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # build.sh pins pi-gen (PIGEN_REF) and cross-compiles airlockd via
      # `make airlockd-arm64`, which stamps $VERSION into the binary.
      - name: Build image with pi-gen
        env:
          VERSION: ${{ env.TAG }}
        run: |
          ./image/pi-gen/build.sh

      - name: Package image
        run: |
          mkdir -p dist
          # pi-gen names it image_<date>-<IMG_NAME><IMG_SUFFIX>.img.xz;
          # our stage has an empty suffix (stage2's -lite export is
          # skipped by build.sh, but match by name regardless).
          shopt -s nullglob
          SRCS=(image/pi-gen/.pi-gen/deploy/*-airlock.img.xz)
          if [ "${#SRCS[@]}" -ne 1 ]; then
              echo "expected exactly one *-airlock.img.xz, found ${#SRCS[@]} — build likely failed" >&2
              ls -la image/pi-gen/.pi-gen/deploy/ >&2 || true
              exit 1
          fi
          NAME="airlock-${TAG}-linux-arm64.img.xz"
          cp "${SRCS[0]}" "dist/${NAME}"
          cd dist
          sha256sum "${NAME}" > "${NAME}.sha256"
          ls -lh "${NAME}" "${NAME}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/airlock-${{ env.TAG }}-linux-arm64.img.xz

      - name: Attach image to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/airlock-${{ env.TAG }}-linux-arm64.img.xz
            dist/airlock-${{ env.TAG }}-linux-arm64.img.xz.sha256

  companion-mac:
    name: Build Mac companion DMG
    needs: release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Developer ID signing + notarisation, only when the secrets exist;
      # otherwise the DMG ships ad-hoc signed as before.
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Import Developer ID certificate and notary key
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # Search the temporary keychain first, keep the runner's own.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Set version in Info.plist to release tag
        working-directory: companion/mac
        run: |
          plutil -replace CFBundleShortVersionString -string "${TAG}" Info.plist
          plutil -replace CFBundleVersion            -string "${TAG}" Info.plist

      - name: Build
        working-directory: companion/mac
        run: ./build.sh

      - name: Sign and notarise app
        if: env.SIGNING == 'true'
        working-directory: companion/mac
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./sign.sh

      - name: Package DMG
        working-directory: companion/mac
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./package.sh

      - name: Rename DMG to tag
        working-directory: companion/mac/build
        run: |
          shopt -s nullglob
          SRCS=(AirlockCompanion-*.dmg)
          [ "${#SRCS[@]}" -ge 1 ] || { echo "package.sh produced no DMG" >&2; exit 1; }
          SRC="${SRCS[0]}"
          DST="AirlockCompanion-${TAG}.dmg"
          if [ "$SRC" != "$DST" ]; then mv "$SRC" "$DST"; fi
          shasum -a 256 "$DST" > "${DST}.sha256"
          ls -lh ./*.dmg ./*.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: companion/mac/build/AirlockCompanion-${{ env.TAG }}.dmg

      - name: Attach DMG to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: |
            companion/mac/build/AirlockCompanion-${{ env.TAG }}.dmg
            companion/mac/build/AirlockCompanion-${{ env.TAG }}.dmg.sha256

      - name: Remove signing keychain and notary key
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
