name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Host build (darwin/linux for editor + CI use)
        run: go build ./...

      - name: Cross-compile linux/arm64 (target platform)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath -ldflags='-s -w' \
            -o /tmp/airlockd.arm64 \
            ./cmd/airlockd
          file /tmp/airlockd.arm64
          ls -lh /tmp/airlockd.arm64

  lint-config:
    name: Shell + config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck + testparm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck samba-common-bin

      - name: Shellcheck
        run: |
          # Every tracked shell script: the installer, the pi-gen stage
          # (including the extension-less host-key helper), the Mac
          # companion build scripts.
          git ls-files -z -- 'scripts/*.sh' 'image/pi-gen/*.sh' 'companion/mac/*.sh' \
              image/pi-gen/stage-airlock/07-ssh-host-keys/files/usr/local/sbin/airlock-ssh-host-keys \
            | xargs -0 -t shellcheck

      - name: testparm (stage smb.conf)
        run: |
          # The base config includes the file airlockd writes at runtime;
          # give testparm an empty one so it doesn't complain.
          sudo mkdir -p /etc/samba/smb.conf.d
          sudo touch /etc/samba/smb.conf.d/airlock.conf
          testparm -s image/pi-gen/stage-airlock/02-samba/files/etc/samba/smb.conf
