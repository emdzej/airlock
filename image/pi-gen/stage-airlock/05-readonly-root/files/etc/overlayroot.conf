# Airlock — read-only root with a tmpfs overlay.
#
# All writes to / are captured in RAM and discarded on reboot. The only
# thing airlock itself persists is the SSH host keys, saved to
# /boot/firmware/airlock/ssh/ (see airlock-ssh-host-keys.service).
# Raspberry Pi Imager customisation (user, SSH key, Wi-Fi) lives in
# cloud-init's user-data / network-config on the boot partition and is
# re-applied on every boot.
#
# To change the OS persistently:
#   - one-off:  sudo overlayroot-chroot   (chroot into the real,
#               writable root; exit to return), or
#   - maintenance boot: append ` overlayroot=disabled` to
#               /boot/firmware/cmdline.txt, reboot, make changes,
#               remove it again and reboot.
# Set overlayroot="" (empty) here to boot with a writable root for good.
overlayroot="tmpfs"
overlayroot_cfgdisk="disabled"
