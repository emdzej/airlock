# XcodeGen spec for the Airlock Companion Xcode project.
#
# XcodeGen is a small tool that reads this YAML and produces
# AirlockCompanion.xcodeproj on demand — the .xcodeproj itself is
# gitignored so we never fight noisy pbxproj diffs.
#
# Install:      brew install xcodegen
# Generate:     xcodegen
# Then open:    open AirlockCompanion.xcodeproj
#
# For CLI builds and CI we use `swift build` + build.sh — the Xcode
# project is purely for developers who want the Xcode UI (debugger,
# breakpoints, storyboard-y previews later).

name: AirlockCompanion

options:
  bundleIdPrefix: pl.emdzej.airlock.companion
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AirlockKit:
    path: ../AirlockKit

targets:
  AirlockCompanion:
    type: application
    platform: macOS
    sources:
      # main.swift is the entry point for both SwiftPM and Xcode (no
      # @main on AppDelegate), so it must stay in the target.
      - path: Sources/AirlockCompanion
      - path: assets/AppIcon.icns
        buildPhase: resources
    # Use the committed Info.plist as-is. No `info:` block — with one,
    # XcodeGen regenerates (overwrites) the plist from its properties
    # and the two copies drift.
    scheme:
      testTargets:
        - AirlockCompanionScreenshots
    dependencies:
      - package: AirlockKit
        product: AirlockKit
      - package: AirlockKit
        product: AirlockUI
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The Xcode project builds the Mac App Store variant: sandboxed,
        # signed by Xcode (Product › Archive). build.sh makes the DMG.
        PRODUCT_BUNDLE_IDENTIFIER: pl.emdzej.airlock.companion
        DEVELOPMENT_TEAM: A2WT9CD8P3
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Informational only — Info.plist carries literal versions
        # (CFBundleVersion == CFBundleShortVersionString, both stamped
        # with the tag by the release workflow).
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "0.5.0"
        # Xcode only accepts major language modes here (5.0 / 6.0);
        # "5.9" is rejected. Matches Package.swift's Swift 5 mode.
        SWIFT_VERSION: "5.0"

  # UI test that walks the main screens for Mac App Store screenshots.
  AirlockCompanionScreenshots:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Screenshots
    dependencies:
      - target: AirlockCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.emdzej.airlock.companion.screenshots
        DEVELOPMENT_TEAM: A2WT9CD8P3
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
